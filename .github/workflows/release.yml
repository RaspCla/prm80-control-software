# Builds the PRM80 control software for Linux and Windows.
#
#  - on every push / pull request: build and test that it compiles
#    (the packages can be downloaded from the run under "Artifacts")
#  - on a version tag (e.g. v2.0.0): additionally creates a GitHub release
#    with the packages for download
#
# Start manually: GitHub > Actions > "Build and release" > "Run workflow".

name: Build and release

on:
  push:
    branches: [ main, modernisierung ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write          # needed to create the release

defaults:
  run:
    working-directory: control_software/trunk

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build jar
        run: mvn -B package
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot
      - name: Program folder (tar.gz)
        run: |
          sh package-linux.sh
          VERSION=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)
          mkdir -p ../../release
          tar -czf ../../release/PRM80-$VERSION-linux-x64.tar.gz -C target/dist PRM80
          cp target/prm80-control-software-$VERSION.jar ../../release/
      - name: Debian / Ubuntu package (.deb)
        run: |
          sh package-linux.sh deb
          cp target/dist/*.deb ../../release/
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: release/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build jar
        run: mvn -B package
      - name: Program folder (zip)
        shell: cmd
        run: call package-windows.bat
      - name: Zip
        shell: pwsh
        run: |
          $version = (mvn -q help:evaluate "-Dexpression=project.version" -DforceStdout)
          New-Item -ItemType Directory -Force -Path ..\..\release | Out-Null
          Compress-Archive -Path target\dist\PRM80 -DestinationPath "..\..\release\PRM80-$version-windows-x64.zip"
      # Windows installer (.msi): jpackage needs the WiX Toolset 3 (candle, light).
      # The WiX 3.14 tools are taken from the NuGet package "wix" (no setup
      # needed). If this fails, the release is still created without the .msi.
      - name: Install WiX Toolset 3.14
        id: wix
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.nuget.org/api/v2/package/wix/3.14.1 -OutFile "$env:RUNNER_TEMP\wix.zip"
          Expand-Archive "$env:RUNNER_TEMP\wix.zip" -DestinationPath "$env:RUNNER_TEMP\wix"
          "$env:RUNNER_TEMP\wix\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Windows installer (msi)
        if: steps.wix.outcome == 'success'
        continue-on-error: true
        shell: cmd
        run: |
          where candle
          call package-windows.bat msi
          if errorlevel 1 exit /b 1
          copy target\dist\*.msi ..\..\release\
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: release/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ linux, windows ]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
          body: |
            Downloads:
            - **Windows**: `PRM80-….msi` – installer (start menu and desktop shortcut). It is not signed: if Windows warns, click "More info" → "Run anyway".
              Or `PRM80-…-windows-x64.zip` – unzip anywhere, start `PRM80\PRM80.exe`. No Java installation needed for both.
            - **Linux**: `prm80_…_amd64.deb` (Debian, Ubuntu, Mint on 64-bit PCs) or `PRM80-…-linux-x64.tar.gz` – unpack, start `PRM80/bin/PRM80`
            - **Any system with Java 21+** (also Raspberry Pi, macOS): `prm80-control-software-….jar` – `java -jar prm80-control-software-….jar`

            Changes: see [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
